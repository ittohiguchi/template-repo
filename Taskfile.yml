# 開発コマンドの単一入口。言語別の lint / typecheck / test / build も
# 必ずここに task として追加する(セットアップ手順は docs/setup-checklist.md)。
version: "3"

tasks:
  default:
    cmds:
      - task --list
    silent: true

  setup:
    desc: git hook (pre-commit) をインストールする
    cmds:
      - pre-commit install

  # check は「全検証を束ねる親 task」。言語別の lint / typecheck / test を
  # 追加したら deps としてここにぶら下げ、CI もこの task を正とする。
  check:
    desc: 全検証を実行する
    deps:
      - test:gitkeep
      - test:ci-policy
      - test:org-init
      - test:release-automation
      - test:repo-init
    cmds:
      - pre-commit run --all-files

  check:pr:
    desc: PR差分に対する高速検証を実行する(BASE_REFとHEAD_REFが必須)
    cmds:
      - test -n "$BASE_REF"
      - test -n "$HEAD_REF"
      - pre-commit run --from-ref "$BASE_REF" --to-ref "$HEAD_REF"

  test:ci-policy:
    desc: CIとrelease認証の契約を検証する
    cmds:
      - bash tests/scripts/test-ci-policy.sh

  test:release-automation:
    desc: release認証と失敗Issue集約を検証する
    cmds:
      - bash tests/scripts/test-release-automation.sh

  test:gitkeep:
    desc: .gitkeep 検出スクリプトのテストを実行する
    cmds:
      - bash tests/scripts/test-check-gitkeep.sh

  test:repo-init:
    desc: GitHub リポジトリ初期化スクリプトのテストを実行する
    cmds:
      - bash tests/scripts/test-init-repo-settings.sh

  test:org-init:
    desc: GitHub organization課金防止スクリプトのテストを実行する
    cmds:
      - bash tests/scripts/test-init-org-settings.sh

  org-init:
    desc: GitHub organizationの追加従量課金を停止する(引数はorganization名)
    cmds:
      - bash scripts/init-org-settings.sh {{.CLI_ARGS}}

  repo-init:
    desc: repository policyを確定しGitHub設定を冪等に適用する
    cmds:
      - bash scripts/init-repo-settings.sh {{.CLI_ARGS}}
