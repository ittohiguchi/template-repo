name: secret-scan

on:
  push:
    branches: [main]
  schedule:
    # Weekly full-history rescan so newly added detection rules catch
    # secrets committed in the past.
    - cron: "0 3 * * 1"
  workflow_dispatch:
    inputs:
      git_ref:
        description: 検証するmain上のcommit SHA
        required: true
        type: string

concurrency:
  group: secret-scan-${{ inputs.git_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write
  statuses: write

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.git_ref || github.sha }}
          # Full history: gitleaks scans every commit, not just the checkout.
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve gitleaks version from pre-commit config
        # Implementation: the single source of truth for the gitleaks version
        # is the pre-commit rev, which Renovate keeps fresh via PRs that run
        # CI. Downloading "latest" here would bypass that review path.
        id: gitleaks
        run: |
          version=$(awk '$1 == "rev:" && found { print $2; exit } /gitleaks\/gitleaks/ { found=1 }' .pre-commit-config.yaml)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Install gitleaks
        # gitleaks CLI is MIT; the license-gated gitleaks-action is not used.
        env:
          GH_TOKEN: ${{ github.token }}
          GITLEAKS_VERSION: ${{ steps.gitleaks.outputs.version }}
        run: |
          cd "$RUNNER_TEMP"
          gh release download "$GITLEAKS_VERSION" --repo gitleaks/gitleaks --pattern "*linux_x64.tar.gz" --output gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - name: Scan full git history
        id: scan
        run: gitleaks git --no-banner --redact --verbose
      - name: 対象commitへ全履歴scan結果を記録
        if: ${{ always() }}
        id: result
        env:
          GH_TOKEN: ${{ github.token }}
          SCAN_OUTCOME: ${{ steps.scan.outcome }}
        run: |
          sha=$(git rev-parse HEAD)
          state=failure
          if [ "$SCAN_OUTCOME" = success ]; then
            state=success
          fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${sha}" \
            -f state="$state" \
            -f context=release/secret-scan \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            -f description="全履歴secret scan: ${state}"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "state=$state" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        if: ${{ always() && steps.result.outcome == 'success' }}
        with:
          ref: main
          path: .release-automation
          persist-credentials: false
      - name: 重複を排除した失敗Issueを更新
        if: ${{ always() && steps.result.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT_SHA: ${{ steps.result.outputs.sha }}
          RESULT_STATE: ${{ steps.result.outputs.state }}
        run: |
          .release-automation/scripts/report-main-verification.sh \
            "$RESULT_STATE" \
            "$RESULT_SHA" \
            "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            secret-scan
